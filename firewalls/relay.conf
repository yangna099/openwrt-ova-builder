# Minimal firewall configuration for the relay's single physical interface.

config defaults
	option syn_flood '1'
	option input 'REJECT'
	option output 'ACCEPT'
	option forward 'REJECT'

config zone 'relay'
	option name 'relay'
	list network 'relay'
	option input 'ACCEPT'
	option output 'ACCEPT'
	option forward 'REJECT'
