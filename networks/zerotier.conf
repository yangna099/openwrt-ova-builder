# OpenWrt network configuration for the ZeroTier OVA with three NICs:
#   eth0 = WAN (DHCP client)
#   eth1 = LAN (10.10.11.1/24)
#   eth2 = Ansible management/internal network (DHCP client)

config interface 'loopback'
	option device 'lo'
	option proto 'static'
	option ipaddr '127.0.0.1'
	option netmask '255.0.0.0'

config device
	option name 'br-lan'
	option type 'bridge'
	list ports 'eth1'

config interface 'lan'
	option device 'br-lan'
	option proto 'static'
	option ipaddr '10.10.11.1'
	option netmask '255.255.255.0'

config interface 'wan'
	option device 'eth0'
	option proto 'dhcp'

config interface 'wan_internal'
	option device 'eth2'
	option proto 'dhcp'
